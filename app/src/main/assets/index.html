<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StepTracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .steps-display {
            text-align: center;
        }
        
        .steps-number {
            font-size: 72px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }
        
        .steps-label {
            font-size: 18px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .progress-ring {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            position: relative;
        }
        
        .progress-ring svg {
            transform: rotate(-90deg);
        }
        
        .progress-ring circle {
            fill: none;
            stroke-width: 15;
        }
        
        .progress-ring .bg {
            stroke: #e0e0e0;
        }
        
        .progress-ring .progress {
            stroke: #667eea;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease;
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        
        .stat-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            text-transform: uppercase;
        }
        
        .input-section {
            margin-top: 20px;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        
        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 18px;
            transition: border-color 0.3s;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .goal-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }
        
        .goal-text {
            text-align: center;
            color: #666;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚶 StepTracker</h1>
            <p>Track your daily steps</p>
        </div>
        
        <div class="card">
            <div class="steps-display">
                <div class="progress-ring">
                    <svg width="200" height="200">
                        <circle class="bg" cx="100" cy="100" r="85"></circle>
                        <circle class="progress" cx="100" cy="100" r="85" 
                            stroke-dasharray="534" 
                            stroke-dashoffset="534"
                            id="progressCircle"></circle>
                    </svg>
                </div>
                <div class="steps-number" id="stepsDisplay">0</div>
                <div class="steps-label">Steps Today</div>
            </div>
            
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-value" id="distanceDisplay">0.0</div>
                    <div class="stat-label">Distance (km)</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="caloriesDisplay">0</div>
                    <div class="stat-label">Calories</div>
                </div>
            </div>
            
            <div class="goal-section">
                <div class="goal-text">
                    Daily Goal: <strong id="goalDisplay">10,000</strong> steps
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="input-section">
                <div class="input-group">
                    <label for="stepsInput">Add Steps Manually</label>
                    <input type="number" id="stepsInput" placeholder="Enter steps" min="0">
                </div>
                <button class="btn" onclick="addSteps()">Add Steps</button>
            </div>
            
            <div class="input-section" style="margin-top: 30px;">
                <div class="input-group">
                    <label for="goalInput">Set Daily Goal</label>
                    <input type="number" id="goalInput" placeholder="Enter goal" min="1000" value="10000">
                </div>
                <button class="btn" onclick="setGoal()">Update Goal</button>
            </div>
        </div>
    </div>

    <script>
        let currentSteps = parseInt(localStorage.getItem('steps') || '0');
        let dailyGoal = parseInt(localStorage.getItem('goal') || '10000');
        
        function updateDisplay() {
            document.getElementById('stepsDisplay').textContent = currentSteps.toLocaleString();
            document.getElementById('goalDisplay').textContent = dailyGoal.toLocaleString();
            
            const distance = (currentSteps * 0.000762).toFixed(2);
            document.getElementById('distanceDisplay').textContent = distance;
            
            const calories = Math.round(currentSteps * 0.04);
            document.getElementById('caloriesDisplay').textContent = calories;
            
            const progress = Math.min(currentSteps / dailyGoal, 1);
            const circumference = 2 * Math.PI * 85;
            const offset = circumference - (progress * circumference);
            document.getElementById('progressCircle').style.strokeDashoffset = offset;
            
            localStorage.setItem('steps', currentSteps);
            localStorage.setItem('goal', dailyGoal);
        }
        
        function addSteps() {
            const input = document.getElementById('stepsInput');
            const steps = parseInt(input.value);
            
            if (steps && steps > 0) {
                currentSteps += steps;
                updateDisplay();
                input.value = '';
                
                if (currentSteps >= dailyGoal) {
                    setTimeout(() => {
                        alert('🎉 Congratulations! You reached your daily goal!');
                    }, 300);
                }
            }
        }
        
        function setGoal() {
            const input = document.getElementById('goalInput');
            const goal = parseInt(input.value);
            
            if (goal && goal >= 1000) {
                dailyGoal = goal;
                updateDisplay();
                input.value = '';
            }
        }
        
        // Check if it's a new day and reset steps
        function checkNewDay() {
            const today = new Date().toDateString();
            const lastDate = localStorage.getItem('lastDate');
            
            if (lastDate !== today) {
                currentSteps = 0;
                localStorage.setItem('lastDate', today);
                updateDisplay();
            }
        }
        
        // Initialize
        checkNewDay();
        updateDisplay();
        
        // Allow Enter key to submit
        document.getElementById('stepsInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addSteps();
        });
        
        document.getElementById('goalInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') setGoal();
        });
    </script>
</body>
</html>
